<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estande Livro</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav>
    <h2>Estante Viva</h2>

    <div class="inicio">
        <a href="">Catálogo</a>
        <span>|</span>
        <a href="">Cadastro</a>
    </div>

    
    </nav>

    
    <main>
    
    <h1>Gerenciamento de livros</h1>

    <form>
        <h3>Cadastrar livro</h3>
        
        <div class="primeiro-cadastro">
        <div class="campo">

        <label>Título *</label>
        <input class="titulo-cadastro"
        type="text"
        placeholder="Informe o título">
        </div>
        
        <div class="campo">
        <label>Autor *</label>
        <input type="text"
        placeholder="Informe o autor">
        </div>   
        
        </div>
        

        <div class="segundo-cadastro">
        
        <div class="campo">
        <label>Preço (R$) *</label>
        <input type="text"
        placeholder="0,00">
        </div>
    
        <div class="campo">
        <label>Quantidade em estoque *</label>
        <input type="text"
        placeholder="0">
        </div>

        <button  class="cadastrar-button">Cadastrar livro</button>

        </div>

    </form>

    
    <h4>Catálogo de livros</h4>

    <div class="barra-pesquisa">
    <input class="buscar"
    type="text"
    placeholder="Buscar por parte do título">

    <div class="button-pesquisa">
    <button class="pesquisar">Buscar</button>

    <button class="limpar">Limpar</button>
        </div>
                </div>

    <table>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
        </tr>

        <tr>
            <td>Título cadastrado</td>
            <td>Nome do autor</td>
            <td>R$ 0,00</td>
            <td>0</td>
            <td>
            <button class="edit">Editar</button>
            <button class="edit">Excluir</button></td>
        </tr>

        <tr>
            <td>Título cadastrado</td>
            <td>Nome do autor</td>
            <td>R$ 0,00</td>
            <td>0</td>
            <td>
            <button class="edit">Editar</button>
            <button class="edit">Excluir</button></td>
        </tr>
    </table>

    <br>

    </main>

    <footer>
        <p>Estante Viva — Gerenciamento de catálogo</p>
    </footer>




        
</body>
</html>
