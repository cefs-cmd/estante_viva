<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Livro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Estante Viva</h2>

        <div class="inicio">
            <a href="">Catálogo</a>
            <span>|</span>
            <a href="">Cadastro</a>
        </div>
    </nav>

    <main>

        <h1>Gerenciamento de livros</h1>

        <form id="book-form" novalidate>

            <h3>Cadastrar livro</h3>

            <div class="primeiro-cadastro">

                <div class="campo">

                    <label for="title">Título *</label>

                    <input id="title" class="titulo-cadastro" type="text" placeholder="Informe o título">

                </div>

                <div class="campo">

                    <label for="autor">Autor *</label>

                    <input id="autor" type="text" placeholder="Informe o autor">

                </div>

            </div>

            <div class="segundo-cadastro">

                <div class="campo">

                    <label for="preco">Preço (R$) *</label>

                    <input id="preco" type="number" placeholder="0,00" min="0.01" step="0.01">

                </div>

                <div class="campo">

                    <label for="quantidade">Quantidade em estoque *</label>

                    <input id="quantidade" type="number" placeholder="0" min="0" step="1">

                </div>

                <button class="cadastrar-button" type="submit">
                    Cadastrar livro
                </button>

            </div>

        </form>


        <h4 id="catalogo">Catálogo de livros</h4>

        <div class="barra-pesquisa">

            <input class="buscar" type="text" placeholder="Buscar por parte do título">

            <div class="button-pesquisa">

                <button class="pesquisar" type="button">
                    Buscar
                </button>

                <button class="limpar" type="button">
                    Limpar
                </button>

            </div>

        </div>


        <!-- TABELA DE LIVROS -->

        <div class="tabela">

            <table id="book-table">

                <thead>

                    <tr>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="book-list">

                </tbody>

            </table>

        </div>

    </main>


    <footer>

        <p>Estante Viva — Gerenciamento de catálogo</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
